name: CI
on:
  push:
    branches: [main, "chore/**", "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5-alpine@sha256:894f570c0cf0664ed5576a8fd5d5bfb8fb1b19d592885b686c3a88c8bd90c41f
        env:
          POSTGRES_USER: agri_test
          POSTGRES_PASSWORD: synthetic_local_test
          POSTGRES_DB: agri_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U agri_test -d agri_test && psql -U agri_test -d agri_test -c 'SELECT PostGIS_Version()' >/dev/null 2>&1"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_TEST_URL: postgresql://agri_test:synthetic_local_test@localhost:5432/agri_test
      DATABASE_URL: postgresql://unused:unused@localhost:5432/unused
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:structure
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
