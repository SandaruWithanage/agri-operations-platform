name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly audit of every fetched ref, even when no pull request is open (UTC). It can also be run on demand
    # (workflow_dispatch), for example to confirm a clean result after an obsolete branch is deleted.
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan (tracked files and history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history so a secret that was committed and later deleted is still found.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.1"
      - name: Scan tracked files and the history reachable from this commit
        run: node scripts/secret-scan.mjs --history
      - name: Weekly audit of every fetched ref
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/secret-scan.mjs --history --all
