version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    # The project compiler is TS 7; this dependency supplies the required TS 6 API.
    # Review compiler/API major transitions together until upstream supports TS 7.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      stable-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      stable-actions:
        patterns:
          - "*"
