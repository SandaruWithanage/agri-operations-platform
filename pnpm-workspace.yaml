packages:
  - "apps/*"
  - "packages/*"
  - "database"
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
strictPeerDependencies: true
overrides:
  "@typescript-eslint/typescript-estree@8.72.2>minimatch": 11.0.5
  # GHSA-7589-6fvf-x4pw: ReDoS in effect <=3.22.0 (patched 3.22.1), reached only through prisma's config package.
  "@prisma/config>effect": 3.22.4
